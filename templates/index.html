<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGISTICS NEXUS // V.2.0.77</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="scanlines"></div>
    <div class="glow-overlay"></div>
    
    <div class="terminal-container">
        <header class="terminal-header">
            <div class="header-left">
                <span class="status-indicator online"></span>
                <h1 class="glitch" data-text="LOGISTICS NEXUS">LOGISTICS NEXUS</h1>
            </div>
            <div class="header-right">
                <span class="sys-info">CPU: <span id="cpu-load">12</span>% // MEM: <span id="mem-load">40</span>%</span>
                <span class="time" id="clock">00:00:00</span>
            </div>
        </header>

        <div class="terminal-window" id="chat-window">
            <div class="message system-msg">
                <span class="timestamp">[INIT]</span> <span class="content">System initialized. Connection established to Neural Network. Waiting for input...</span>
            </div>
        </div>

        <div class="input-area">
            <span class="prompt-symbol">➜</span>
            <input type="text" id="user-input" placeholder="Enter command or query..." autocomplete="off">
            <button id="send-btn">EXECUTE</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
